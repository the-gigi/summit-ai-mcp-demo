[project]
name = "summit-ai-mcp-demo"
version = "0.1.0"
description = "Quote MCP server demo for the talk 'Custom MCP Server Architecture for Personal AI Assistance'"
requires-python = ">=3.10"
dependencies = [
    # ai-six 0.14.6 needs the a2a-sdk 0.3.x API; 1.x removed a2a.client.helpers.
    "a2a-sdk[http-server]==0.3.6",
    "ai-six>=0.14.6",
    "mcp[cli]>=1.2.0",
]

[tool.uv]
package = false

# Pin the default index to PyPI so a machine-level proxy registry cannot rewrite
# uv.lock source URLs to a host nobody outside that network can reach.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
